<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Child — Ijwi</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="nav-brand"><span>🌿</span> Ijwi Autism Care</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <div class="form-page">
    <div class="form-card">
      <h2>Register a child</h2>
      <p class="subtitle">The system screens children aged 0–72 months (6 years)</p>

      <div class="alert" id="alert"></div>

      <div class="disclaimer">
        <span>⚠️</span>
        <div>Ijwi is a screening tool only — not an official medical diagnosis. A qualified professional must confirm any result.</div>
      </div>

      <div class="form-group">
        <label for="full_name">Child's full name</label>
        <input type="text" id="full_name" placeholder="Enter child's full name">
        <div class="field-error" id="name-error"></div>
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender">
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <div class="field-error" id="gender-error"></div>
      </div>

      <div class="form-group">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob">
        <div class="field-error" id="dob-error"></div>
      </div>

      <div class="form-group">
        <label for="district">District</label>
        <select id="district">
          <option value="">Select district</option>
        </select>
        <div class="field-error" id="district-error"></div>
      </div>

      <div class="consent-box">
        <label>
          <input type="checkbox" id="consent">
          I, the guardian, give consent for this child's health data to be stored and processed securely by Ijwi Autism Care for the purpose of developmental screening. I understand this is not an official diagnosis.
        </label>
        <div class="field-error" id="consent-error"></div>
      </div>

      <button class="btn btn-primary btn-full" id="submit-btn">Register child</button>
      <a href="/dashboard.html" class="btn btn-secondary btn-full mt-16">← Back to dashboard</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
  <script>
    requireAuth();
    populateDistricts('district');

    // Set max date to today
    document.getElementById('dob').max = new Date().toISOString().split('T')[0];

    document.getElementById('submit-btn').addEventListener('click', async () => {
      clearErrors();
      const full_name = document.getElementById('full_name').value.trim();
      const gender = document.getElementById('gender').value;
      const date_of_birth = document.getElementById('dob').value;
      const district = document.getElementById('district').value;
      const consent_given = document.getElementById('consent').checked;
      let valid = true;

      if (!full_name) { showError('name-error', 'Child name is required'); valid = false; }
      if (!gender) { showError('gender-error', 'Please select gender'); valid = false; }
      if (!date_of_birth) { showError('dob-error', 'Date of birth is required'); valid = false; }
      if (!district) { showError('district-error', 'Please select district'); valid = false; }
      if (!consent_given) { showError('consent-error', 'You must give consent to proceed'); valid = false; }
      if (!valid) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Registering...';

      try {
        const data = await apiFetch('/children', {
          method: 'POST',
          body: JSON.stringify({ full_name, gender, date_of_birth, district, consent_given })
        });
        window.location.href = `/screening.html?child_id=${data.child_id}`;
      } catch (err) {
        showAlert('alert', err.message);
        btn.disabled = false;
        btn.textContent = 'Register child';
      }
    });
  </script>
</body>
</html>
