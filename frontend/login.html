<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ijwi</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="nav-brand"><span>🌿</span> Ijwi Autism Care</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <div class="form-page">
    <div class="form-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Log in to your Ijwi account</p>

      <div class="alert" id="alert"></div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com">
        <div class="field-error" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password">
        <div class="field-error" id="password-error"></div>
      </div>

      <button class="btn btn-primary btn-full" id="login-btn">Login</button>

      <p class="text-center mt-16" style="font-size:14px;color:#4b5563">
        Don't have an account? <a href="/register.html" style="color:#1a7a4a;font-weight:600">Register here</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
  <script>
    // Redirect if already logged in
    if (getToken()) window.location.href = '/dashboard.html';

    document.getElementById('login-btn').addEventListener('click', async () => {
      clearErrors();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      if (!email) { showError('email-error', 'Email is required'); valid = false; }
      if (!password) { showError('password-error', 'Password is required'); valid = false; }
      if (!valid) return;

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        saveAuth(data.token, data.name, data.role);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showAlert('alert', err.message);
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
